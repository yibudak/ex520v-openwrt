name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write        # for build provenance attestation
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # A from-scratch OpenWrt build needs ~25 GB; the hosted runner's root
      # disk is too small, so reclaim space from preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/lib/jvm || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget zstd

      # OpenWrt is reproducible: a from-source build here produces the same
      # image bytes anyone else gets from the same pinned source.
      - name: Build
        run: ./build.sh "$(nproc)"

      - name: Collect images
        id: collect
        run: |
          mkdir -p out
          cp openwrt/bin/targets/mediatek/filogic/*tplink_ex520v* out/
          cp openwrt/bin/targets/mediatek/filogic/sha256sums out/ 2>/dev/null || true
          cp openwrt/bin/targets/mediatek/filogic/*.manifest out/ 2>/dev/null || true
          (cd out && sha256sum *tplink_ex520v* > SHA256SUMS.ex520v)
          ls -l out
          cat out/SHA256SUMS.ex520v

      # Cryptographic proof that these files were built by this workflow from
      # this repo (verifiable with: gh attestation verify <file> -R <owner>/<repo>).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'out/*tplink_ex520v*'

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-tplink_ex520v
          path: out/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

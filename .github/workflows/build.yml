name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget zstd

      - name: Build
        run: ./build.sh "$(nproc)"

      - name: Collect images
        run: |
          mkdir -p out
          cp openwrt/bin/targets/mediatek/filogic/*tplink_ex520v* out/
          cp openwrt/bin/targets/mediatek/filogic/sha256sums out/
          cp openwrt/bin/targets/mediatek/filogic/*.manifest out/ 2>/dev/null || true
          (cd out && sha256sum *tplink_ex520v* > SHA256SUMS.ex520v)
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-tplink_ex520v
          path: out/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
